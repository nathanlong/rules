name: Deploy

on:
  push:
    branches:
      - main

permissions:
  # peaceiris/actions-gh-pages pushes the build to the gh-pages branch.
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build (includes astro check)
        run: npm run build

      - name: Check every old URL still exists
        run: npm run parity

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: dist
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No `cname`: the custom domain belongs to the root user site, not this project.
